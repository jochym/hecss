name: Tests

on: [workflow_dispatch, pull_request, push]

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv venv
      - run: uv pip install -e '.[test]'
      - run: uv run --no-project python -m pytest -q

  asap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - run: uv venv
      - run: uv pip install -e '.[test]'
      - run: uv run --no-project python -m pytest -q -m asap
